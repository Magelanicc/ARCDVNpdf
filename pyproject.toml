[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arcdvnpdf"
version = "0.2.0"
description = "ARCDVNpdf - Local PDF and document utility CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pypdf>=6.0",
    "Pillow>=11.0",
    "PyMuPDF>=1.26",
    "python-docx>=1.1"
]

[project.scripts]
ARCDVNpdf = "ARCDVNpdf:main"
arcdvnpdf = "ARCDVNpdf:main"

[tool.setuptools]
py-modules = ["ARCDVNpdf"]
